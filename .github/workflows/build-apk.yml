name: Build CHATEAMS Android APK
on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp *.html *.json *.js *.svg *.png www/ 2>/dev/null || true
          rm -f www/package.json www/package-lock.json www/capacitor.config.json

      - name: Install Capacitor and add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "CHATEAMS" "com.chateams.app" --web-dir=www
          fi
          rm -rf android
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHATEAMS-v1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
